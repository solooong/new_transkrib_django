# Конфигурация читается из .env (лежит рядом с этим файлом).
# Каждое значение имеет запасное: проект запустится даже без .env.

services:
  web:
    build: .
    container_name: transkrib-web
    restart: unless-stopped
    ports:
      - "${TRANSCRIB_PORT:-8000}:8000"     # Django (интерфейс)
      - "${RUNNER_PORT_HOST:-8800}:8800"   # Flask-runner (для отладки)
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-transkrib-local-dev-key}"
      DJANGO_CSRF_ORIGINS: "${DJANGO_CSRF_ORIGINS:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      # Каталог и имя файла скрипта транскрибации (volume ./scripts:/app/scripts)
      TRANSCRIBE_SCRIPT_DIR: "${TRANSCRIBE_SCRIPT_DIR:-scripts}"
      TRANSCRIBE_SCRIPT_NAME: "${TRANSCRIBE_SCRIPT_NAME:-1.py}"
      # Flask-runner (живёт в этом же контейнере, стартует entrypoint'ом)
      RUNNER_PORT: "8800"
      RUNNER_URL: "${RUNNER_URL:-http://127.0.0.1:8800}"
      DJANGO_INTERNAL_BASE: "${DJANGO_INTERNAL_BASE:-http://127.0.0.1:8000}"
      RUNNER_SECRET: "${RUNNER_SECRET:-dev-runner-secret-change-me}"
      MAX_CONCURRENT_TASKS: "${MAX_CONCURRENT_TASKS:-1}"
    volumes:
      # Скрипт транскрибации (1.py) — кладёте в ./scripts на хосте,
      # попадает в контейнер как есть и проектом не изменяется.
      - ./scripts:/app/scripts
      # Загрузки и результаты транскрибации
      - ./media:/app/media
      # Логи Django
      - ./logs:/app/logs
      # База SQLite (переживает пересоздание контейнера)
      - db_data:/app/data
      # Данные для импорта и оценки звонков
      - ./data:/app/data
      # Доступ к /proc хоста для корректных метрик системы (опционально)
      - /proc:/host/proc:ro
    # Видит процессы хоста для точных метрик CPU/RAM (опционально)
    # pid: host

volumes:
  db_data:
