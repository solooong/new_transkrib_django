services:
  web:
    build: .
    container_name: transkrib-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      # Каталог, куда кладётся файл скрипта транскрибации (volume ниже).
      TRANSCRIBE_SCRIPT_DIR: "scripts"
      # Имя файла скрипта внутри каталога.
      TRANSCRIBE_SCRIPT_NAME: "1.py"
      # Если у скрипта другой интерфейс аргументов, раскомментируйте и поправьте:
      # TRANSCRIBE_CMD: "python scripts/1.py {input} {output}"
      MAX_CONCURRENT_TASKS: "1"
      METRICS_INTERVAL: "2"
    volumes:
      # Ваш скрипт транскрибации: положите файл 1.py в ./scripts на хосте —
      # он попадёт в контейнер как есть и НЕ изменяется проектом.
      - ./scripts:/app/scripts
      # Загрузки и результаты транскрибации.
      - ./media:/app/media
      # Логи Django.
      - ./logs:/app/logs
      # База SQLite (переживает пересоздание контейнера).
      - db_data:/app/data

volumes:
  db_data:
